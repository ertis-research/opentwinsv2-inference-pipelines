apiVersion: v1
kind: Namespace
metadata:
  name: YOUR_K8S_NAMESPACE
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opentrack-api-sa
  namespace: YOUR_K8S_NAMESPACE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opentrack-api-cluster-role
rules:
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opentrack-api-rolebinding
  namespace: YOUR_K8S_NAMESPACE
subjects:
- kind: ServiceAccount
  name: opentrack-api-sa
  namespace: YOUR_K8S_NAMESPACE
roleRef:
  kind: ClusterRole
  name: opentrack-api-cluster-role
  apiGroup: rbac.authorization.k8s.io
